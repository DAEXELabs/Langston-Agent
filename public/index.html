<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Langston is an operations intelligence assistant for ServiceTitan QC and field leadership."
    />
    <title>Langston</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <img src="/langston_header_transparent.png" alt="Langston AI Agent" />
        </div>
      </header>

      <main id="appMain">
        <div class="workspace">
          <aside class="history-panel" aria-label="Chat history">
            <div class="profile-card">
              <h2>History Profile</h2>
              <p id="profileStatus">Guest mode: chat works, history is off.</p>
              <input id="profileName" type="text" placeholder="Name or email" />
              <input id="profileKey" type="text" placeholder="Profile key" />
              <div class="login-actions">
                <button id="profileLogin" type="button">Turn On History</button>
                <button id="profileLogout" class="secondary hidden" type="button">Turn Off</button>
              </div>
            </div>

            <div class="history-heading">
              <h2>History</h2>
              <button id="newChat" class="secondary" type="button">New</button>
            </div>
            <div id="historyList" class="history-list"></div>
          </aside>

          <section class="chat-panel">
            <div class="panel-heading">
              <div>
                <h2>Ask Langston</h2>
                <p>Talk to Langston naturally. Ask for QC, coaching, follow-up, payments, forms, or ServiceTitan jobs.</p>
              </div>
            </div>

            <div id="chatLog" class="chat-log" aria-live="polite"></div>

            <div class="prompt-row">
              <textarea id="promptInput" placeholder="Message Langston..."></textarea>
              <button id="sendPrompt" type="button">Send</button>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
